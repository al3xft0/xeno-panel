name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dylib:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: build panel dylib
        run: make

      - name: build dump dylib
        run: make dump

      - uses: actions/upload-artifact@v4
        with:
          name: xeno-dylibs
          path: |
            FreeFirePanel.dylib
            OffsetsDump.dylib
          if-no-files-found: error
